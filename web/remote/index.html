<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MeisterCode · remoto</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --text:#e8eaed; --dim:#9aa3af; --accent:#5b8def; --bad:#e5645a; --ok:#4caf7a; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; }
  button, select, textarea, input { font:inherit; color:inherit; }
  button { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  button:disabled { opacity:.5; }
  .hidden { display:none !important; }
  header { display:flex; gap:8px; align-items:center; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid var(--line); }
  header select { flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px; }
  #messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
  .msg { max-width:92%; padding:10px 12px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg.assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .msg.error { border-color:var(--bad); }
  .msg .steps { margin-top:8px; font-size:13px; color:var(--dim); border-top:1px solid var(--line); padding-top:6px; }
  .msg .steps .bad { color:var(--bad); }
  .empty { color:var(--dim); text-align:center; margin-top:30%; }
  #status { min-height:20px; padding:0 12px; font-size:13px; color:var(--dim); }
  #status.bad { color:var(--bad); }
  footer { display:flex; gap:8px; padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); }
  footer textarea { flex:1; min-width:0; resize:none; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px; max-height:40vh; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; width:100%; max-width:440px; max-height:90vh; overflow:auto; }
  .card h2 { margin:0 0 8px; font-size:18px; }
  .card pre { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:13px; max-height:45vh; overflow:auto; }
  .card input { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:22px; letter-spacing:3px; text-transform:uppercase; text-align:center; }
  .card .row { display:flex; gap:8px; margin-top:12px; }
  .card .row button { flex:1; }
  .card p { color:var(--dim); font-size:14px; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:var(--bad); color:#fff; margin-left:6px; }
</style>
</head>
<body>
  <header>
    <select id="context" aria-label="Conversa ou projeto"></select>
    <button id="new" title="Nova conversa" aria-label="Nova conversa">＋</button>
  </header>
  <main id="messages" aria-live="polite"><p class="empty">A ligar…</p></main>
  <div id="status" role="status"></div>
  <footer>
    <textarea id="text" rows="1" placeholder="Escreve uma mensagem…" aria-label="Mensagem"></textarea>
    <button id="send" class="primary" aria-label="Enviar">➤</button>
    <button id="stop" class="bad hidden" aria-label="Parar a resposta">■</button>
  </footer>

  <div id="pair" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Emparelhar">
    <div class="card">
      <h2>Emparelhar este dispositivo</h2>
      <p>No PC, escreve <b>/remote-control</b> na app e copia para aqui o código que ela mostra.</p>
      <input id="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" aria-label="Código de emparelhamento">
      <p id="pair-error" role="alert"></p>
      <div class="row"><button id="pair-ok" class="primary">Ligar</button></div>
    </div>
  </div>

  <div id="approval" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Pedido de autorização">
    <div class="card">
      <h2><span id="approval-summary"></span><span id="approval-category" class="badge"></span></h2>
      <pre id="approval-detail"></pre>
      <p>O agente está à espera desta resposta no teu PC.</p>
      <div class="row"><button id="approval-deny">Recusar</button><button id="approval-allow" class="primary">Permitir</button></div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
